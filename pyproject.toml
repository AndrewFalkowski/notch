[project]
name = "notch"
version = "0.1.1"
description = "A plain-text lab notebook CLI for humans and agents."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "textual>=0.86",
]

[project.scripts]
notch = "notch.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/notch"]
